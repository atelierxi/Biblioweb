<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiblioWeb - Lectores</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"></head><body>
<header class="encabezado"><h1>BiblioWeb · Lectores</h1><nav><a href="panel.html">Panel</a><button onclick="cerrarSesion()">Cerrar sesión</button></nav></header>
<main class="contenedor"><div id="alerta" class="alerta"></div>
<section class="tarjeta"><h2 id="tituloForm">Nuevo lector</h2><form id="formUsuario">
<div class="grid-2"><div class="campo"><label>Nombres</label><input id="nombres" maxlength="80" required></div><div class="campo"><label>Apellidos</label><input id="apellidos" maxlength="80" required></div>
<div class="campo"><label>Correo</label><input id="correo" type="email" maxlength="120" required></div><div class="campo"><label>Contraseña <span class="muted">(déjela vacía al editar para conservarla)</span></label><input id="password" type="password" minlength="4" maxlength="100"></div>
<div class="campo"><label>Estado</label><select id="estado"><option>ACTIVO</option><option>INACTIVO</option></select></div></div>
<div class="acciones"><button class="boton" type="submit">Guardar</button><button id="btnCancelar" class="boton secundario" type="button">Cancelar</button></div></form></section>
<section class="tarjeta"><h2>Lectores registrados</h2><div class="tabla-wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tablaUsuarios"></tbody></table></div></section>
</main><script src="js/request.js"></script><script src="js/auth.js"></script><script src="js/usuarios.js"></script></body></html>
