<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiblioWeb - Categorías</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"></head><body>
<header class="encabezado"><h1>BiblioWeb · Categorías</h1><nav><a href="panel.html">Panel</a><a href="catalogo.html">Catálogo</a><button onclick="cerrarSesion()">Cerrar sesión</button></nav></header>
<main class="contenedor">
<div id="alerta" class="alerta"></div>
<section class="tarjeta"><h2 id="tituloForm">Nueva categoría</h2>
<form id="formCategoria"><div class="grid-2"><div class="campo"><label for="nombre">Nombre</label><input id="nombre" maxlength="80" required></div><div class="campo"><label for="descripcion">Descripción</label><input id="descripcion" maxlength="255"></div></div>
<div class="acciones"><button class="boton" type="submit">Guardar</button><button id="btnCancelar" class="boton secundario" type="button">Cancelar</button></div></form></section>
<section class="tarjeta"><h2>Categorías registradas</h2><div class="tabla-wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody id="tablaCategorias"></tbody></table></div></section>
</main><script src="js/request.js"></script><script src="js/auth.js"></script><script src="js/categorias.js"></script></body></html>
