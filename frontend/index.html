<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiblioWeb - Inicio de sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <h1>BiblioWeb</h1>
      <p class="muted">Sistema web para la gestión de libros y préstamos.</p>
      <div id="alertaLogin" class="alerta"></div>
      <form id="formLogin">
        <div class="campo">
          <label for="correo">Correo</label>
          <input id="correo" type="email" required autocomplete="username" placeholder="admin@biblioweb.test">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button id="btnIngresar" class="boton" type="submit">Ingresar</button>
      </form>
      <hr>
      <small class="muted">Proyecto académico - Desarrollo de Aplicaciones Empresariales - UTS.</small>
    </section>
  </main>
  <script src="js/request.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
