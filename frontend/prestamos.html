<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiblioWeb - Préstamos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"></head><body>
<header class="encabezado"><h1>BiblioWeb · Préstamos</h1><nav><a href="panel.html">Panel</a><a href="catalogo.html">Catálogo</a><button onclick="cerrarSesion()">Cerrar sesión</button></nav></header>
<main class="contenedor"><div id="alerta" class="alerta"></div>
<section class="tarjeta"><h2>Registrar préstamo</h2><form id="formPrestamo"><div class="grid-2">
<div class="campo"><label>Lector activo</label><select id="usuario" required></select></div><div class="campo"><label>Libro disponible</label><select id="libro" required></select></div>
<div class="campo"><label>Fecha de préstamo</label><input id="fechaPrestamo" type="date" required></div><div class="campo"><label>Fecha límite</label><input id="fechaLimite" type="date" required></div></div>
<button class="boton" type="submit">Registrar préstamo</button></form></section>
<section class="tarjeta"><h2>Historial de préstamos</h2><div class="tabla-wrap"><table><thead><tr><th>ID</th><th>Lector</th><th>Libro</th><th>Préstamo</th><th>Límite</th><th>Devolución</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tablaPrestamos"></tbody></table></div></section>
</main><script src="js/request.js"></script><script src="js/auth.js"></script><script src="js/prestamos.js"></script></body></html>
