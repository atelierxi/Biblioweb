<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiblioWeb - Libros</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"></head><body>
<header class="encabezado"><h1>BiblioWeb · Libros</h1><nav><a href="panel.html">Panel</a><a href="catalogo.html">Catálogo</a><button onclick="cerrarSesion()">Cerrar sesión</button></nav></header>
<main class="contenedor"><div id="alerta" class="alerta"></div>
<section class="tarjeta"><h2 id="tituloForm">Nuevo libro</h2><form id="formLibro">
<div class="grid-2"><div class="campo"><label>Título</label><input id="titulo" maxlength="180" required></div><div class="campo"><label>Autor</label><input id="autor" maxlength="150" required></div>
<div class="campo"><label>ISBN</label><input id="isbn" maxlength="20" required></div><div class="campo"><label>Año</label><input id="anio" type="number" min="1000" max="2100"></div>
<div class="campo"><label>Categoría</label><select id="categoria" required></select></div><div class="campo"><label>Estado</label><select id="estado" required><option>DISPONIBLE</option><option>INACTIVO</option><option>PRESTADO</option></select></div></div>
<div class="acciones"><button class="boton" type="submit">Guardar</button><button id="btnCancelar" class="boton secundario" type="button">Cancelar</button></div></form></section>
<section class="tarjeta"><h2>Libros registrados</h2><div class="tabla-wrap"><table><thead><tr><th>ID</th><th>Título</th><th>Autor</th><th>ISBN</th><th>Año</th><th>Categoría</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tablaLibros"></tbody></table></div></section>
</main><script src="js/request.js"></script><script src="js/auth.js"></script><script src="js/libros.js"></script></body></html>
