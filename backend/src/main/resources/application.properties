spring.application.name=BiblioWeb
server.port=8094

# Base de datos local de Martin. Antes de ejecutar, escribe tu clave despues del =
spring.datasource.url=jdbc:mysql://localhost:3307/biblioweb?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

spring.jackson.time-zone=America/Bogota
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
